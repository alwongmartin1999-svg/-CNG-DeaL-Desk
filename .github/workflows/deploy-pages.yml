name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Build static site
        env:
          GITHUB_PAGES: "true"
          VITE_STATIC_HOST: "true"
          VITE_AUTH_ENABLED: "false"
        run: |
          REPO="${GITHUB_REPOSITORY#*/}"
          case "$REPO" in
            *.github.io) export BASE_PATH="/" ;;
            *) export BASE_PATH="/$REPO/" ;;
          esac
          echo "Building with BASE_PATH=$BASE_PATH"
          npm run build
      - name: Find the build output
        id: out
        run: |
          for d in .output/public dist/client dist; do
            if [ -f "$d/_shell.html" ] && [ ! -f "$d/index.html" ]; then
              cp "$d/_shell.html" "$d/index.html"
            fi
            if [ -f "$d/index.html" ]; then
              cp "$d/index.html" "$d/404.html"
              echo "dir=$d" >> "$GITHUB_OUTPUT"
              echo "Publishing $d"
              exit 0
            fi
          done
          echo "No index.html found. Build output was:"
          ls -la .output dist 2>/dev/null || true
          exit 1
      - uses: actions/upload-pages-artifact@v3
        with:
          path: ${{ steps.out.outputs.dir }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
